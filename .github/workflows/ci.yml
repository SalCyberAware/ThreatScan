name: CI — Build & Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        # Node 24, the major backend/package.json pins in engines.node, which
        # is also what Railway builds and runs the backend on.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: backend

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage/
          if-no-files-found: warn

      - name: Check for syntax errors
        run: node --check server.js
        working-directory: backend

  # Builds backend/Dockerfile, the image Railway deploys, and proves it starts
  # and answers /api/health. No API keys are passed: the health endpoint only
  # reads which key names are set, so this makes no upstream call.
  container:
    name: Backend container (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A decoy .env proves .dockerignore keeps env files out of the image.
      - name: Plant a decoy .env
        run: echo "DECOY=1" > backend/.env

      # CI takes the base image from the GHCR mirror that PromptShield's
      # .github/workflows/mirror-base-images.yml keeps, because public.ecr.aws
      # answers anonymous pulls from GitHub runners with 429 "Data limit
      # exceeded" now and then. The Dockerfile keeps its public.ecr.aws FROM
      # lines, so Railway and Dependabot see no change. Pointing public.ecr.aws
      # at 0.0.0.0 for the rest of this job makes the build fail instead of
      # quietly falling back to it.
      - name: Block public.ecr.aws for the rest of the job
        run: |
          echo "0.0.0.0 public.ecr.aws" | sudo tee -a /etc/hosts >/dev/null
          if curl -s -o /dev/null --max-time 10 https://public.ecr.aws/v2/; then
            echo "public.ecr.aws is still reachable"; exit 1
          fi
          echo "public.ecr.aws blocked"

      # For each digest-pinned FROM ref, pull the mirror copy of the same digest
      # with backoff (waits of 20, 40, 80 and 160 s, now for GHCR hiccups),
      # check that the image pulled has exactly the Dockerfile's digest, and
      # record a --build-context that makes the build use it in place of the
      # FROM ref. The mirror path is the ref without public.ecr.aws/docker/library/.
      - name: Pull the base image from the GHCR mirror (with retries)
        env:
          DOCKERFILES: backend/Dockerfile
          MIRROR: ghcr.io/salcyberaware/mirror
          UPSTREAM: public.ecr.aws/docker/library/
        run: |
          refs=$(echo "$DOCKERFILES" | xargs grep -hiE '^[[:space:]]*FROM[[:space:]]' | grep -oE '[^[:space:]]+@sha256:[0-9a-f]{64}' | sort -u) || true
          test -n "$refs" || { echo "no digest-pinned FROM line in $DOCKERFILES"; exit 1; }
          contexts="$RUNNER_TEMP/base-image-contexts"
          : > "$contexts"
          pull_err="$RUNNER_TEMP/base-image-pull.err"
          for ref in $refs; do
            name_tag=${ref%%@*}
            pinned=${ref#*@}
            case $name_tag in
              "$UPSTREAM"*) ;;
              *) echo "$name_tag is not under $UPSTREAM, so it has no mirror path"; exit 1 ;;
            esac
            path=${name_tag#"$UPSTREAM"}
            mirror_ref="$MIRROR/$path@$pinned"
            echo "Pulling $MIRROR/$path at $pinned (Dockerfile pin)"
            attempt=0
            pulled=0
            for wait_s in 20 40 80 160 last; do
              attempt=$((attempt + 1))
              status=0
              docker pull --quiet "$mirror_ref" >/dev/null 2>"$pull_err" || status=$?
              echo "attempt $attempt: exit $status"
              if [ "$status" -eq 0 ]; then pulled=1; break; fi
              if [ "$wait_s" != last ]; then sleep "$wait_s"; fi
            done
            if [ "$pulled" -ne 1 ]; then
              echo "Every attempt failed. Last 5 lines of the last error:"
              tail -n 5 "$pull_err"
              exit 1
            fi
            got=$(docker image inspect --format '{{join .RepoDigests "\n"}}' "$mirror_ref" \
              | grep -E "^$MIRROR/${path%%:*}@sha256:[0-9a-f]{64}$" | sed 's/.*@//' | sort -u)
            if [ "$got" != "$pinned" ]; then
              echo "digest mismatch for $path: Dockerfile pins $pinned, mirror image has ${got:-none}"
              exit 1
            fi
            echo "digest match: $MIRROR/${path%%:*}@$got equals the Dockerfile pin"
            printf '%s\n' --build-context "$ref=docker-image://$mirror_ref" >> "$contexts"
          done

      # Plain progress, so the log names the registry each base image came from.
      - name: Build the image
        run: |
          mapfile -t contexts < "$RUNNER_TEMP/base-image-contexts"
          test "${#contexts[@]}" -gt 0 || { echo "no base image context recorded"; exit 1; }
          docker build --progress=plain "${contexts[@]}" -t threatscan-backend:ci backend

      - name: Image runs as non-root and holds no env file or tests
        run: |
          uid=$(docker run --rm --entrypoint id threatscan-backend:ci -u)
          test "$uid" != "0" || { echo "image runs as root"; exit 1; }
          docker run --rm --entrypoint sh threatscan-backend:ci -c \
            'test ! -e /app/.env && test -z "$(find /app -name "*.test.js" -not -path "*/node_modules/*")"'

      # PORT=8080 rather than the default, to prove the container listens on
      # whatever port the platform hands it. FRONTEND_URL is a placeholder
      # origin; production mode refuses to start without one. The commit goes in
      # RAILWAY_GIT_COMMIT_SHA, the variable /api/health reads first in production.
      - name: Start the container and check /api/health
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          docker run -d --name api -p 8080:8080 \
            -e PORT=8080 -e FRONTEND_URL=https://example.com \
            -e RAILWAY_GIT_COMMIT_SHA="$EXPECTED_SHA" threatscan-backend:ci
          for _ in $(seq 1 30); do
            curl -fsS -o health.json http://127.0.0.1:8080/api/health && break
            sleep 2
          done
          test -s health.json || { echo "no healthy answer in 60s"; exit 1; }
          node -e '
            const h = require("./health.json");
            const fail = (m) => { console.error(m); process.exit(1); };
            if (h.status !== "ok") fail("status " + h.status);
            if (h.commit !== process.env.EXPECTED_SHA) fail("commit " + h.commit);
            if (h.node !== "24") fail("node " + h.node);
            console.log("health ok:", { commit: h.commit, node: h.node });
          '

      # docker stop sends SIGTERM to node as PID 1, the same signal Railway
      # sends the old deployment, then SIGKILL after 15 seconds, matching the
      # Draining time in the service's Railway Teardown setting
      # (Settings > Deploy > Teardown). Exit code 0 means the handler ran and
      # closed the server; a SIGKILL would show 137.
      - name: SIGTERM shuts the container down cleanly
        run: |
          start=$(date +%s)
          docker stop --time 15 api
          elapsed=$(( $(date +%s) - start ))
          code=$(docker inspect --format '{{.State.ExitCode}}' api)
          docker logs api 2>&1 | grep -q "SIGTERM received: shutdown started" \
            || { echo "no shutdown line in the container log"; exit 1; }
          test "$code" = "0" || { echo "container exited with $code after ${elapsed}s"; exit 1; }
          echo "clean exit 0 after ${elapsed}s"

      - name: Container logs
        if: always()
        run: docker logs api || true

  frontend:
    name: Frontend (lint + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Lint with eslint
        run: npm run lint

      - name: Build with vite
        run: npm run build
        env:
          VITE_API_URL: /api

      - name: Run vitest
        run: npm test
