name: Bug report
description: Something in ThreatScan is not working as expected.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Security issues do not belong here.** Use private vulnerability reporting instead (see SECURITY.md).
        Never paste API keys or other secrets into this form.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Scan indicator ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did this happen?
      options:
        - Live demo (threat-scan.vercel.app)
        - Self-hosted / local
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend / API
        - Frontend / UI
        - A specific engine
        - CI / tooling
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit SHA or version
      description: For self-hosted runs, the output of `git rev-parse HEAD`.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact any keys, tokens or personal data before pasting.
      render: shell
